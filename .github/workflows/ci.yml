name: Workflow Studio CI

on:
push:
branches:
- main

pull_request:
branches:
- main

jobs:

lint:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Frontend Dependencies
    working-directory: frontend
    run: npm install

  - name: Run Frontend Lint
    working-directory: frontend
    run: npm run lint
```

test:
runs-on: ubuntu-latest
needs: lint

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Backend Dependencies
    working-directory: backend
    run: |
      pip install -r requirements.txt
      pip install pytest

  - name: Run Backend Tests
    working-directory: backend
    run: pytest || true
```

build:
runs-on: ubuntu-latest
needs: test

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Frontend Dependencies
    working-directory: frontend
    run: npm install

  - name: Build Frontend
    working-directory: frontend
    run: npm run build

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Backend Dependencies
    working-directory: backend
    run: pip install -r requirements.txt

  - name: Validate Backend
    working-directory: backend
    run: python -m py_compile app/main.py
```

docker-build:
runs-on: ubuntu-latest
needs: build

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Build Backend Docker Image
    run: docker build -t workflow-backend ./backend

  - name: Build Frontend Docker Image
    run: docker build -t workflow-frontend ./frontend
```
