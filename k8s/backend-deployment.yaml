apiVersion: apps/v1
kind: Deployment

metadata:
  name: workflow-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: workflow-backend

  template:
    metadata:
      labels:
        app: workflow-backend

    spec:
      containers:
      - name: workflow-backend
        image: workflow-backend:analytics-fix
        imagePullPolicy: IfNotPresent
        env:
        - name: MONGO_URI
          value: "mongodb://host.docker.internal:27017"
        - name: REDIS_HOST
          value: "redis-service"
        ports:
        - containerPort: 8000
