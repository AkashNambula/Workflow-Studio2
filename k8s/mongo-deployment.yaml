apiVersion: apps/v1
kind: Deployment

metadata:
  name: workflow-mongo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: workflow-mongo

  template:
    metadata:
      labels:
        app: workflow-mongo

    spec:
      containers:
      - name: workflow-mongo
        image: mongo:7

        ports:
        - containerPort: 27017