services:

  redis-service:
    image: redis:7-alpine
    container_name: workflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    container_name: workflow-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
      - DB_NAME=workflow_studio
      - REDIS_HOST=redis-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: workflow-frontend
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy

  celery-worker:
    build: ./backend
    container_name: workflow-celery-worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
      - DB_NAME=workflow_studio
      - REDIS_HOST=redis-service
    depends_on:
      redis-service:
        condition: service_healthy
      backend:
        condition: service_healthy

  flower:
    image: mher/flower:2.0.1
    container_name: workflow-flower
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis-service:
        condition: service_healthy
      celery-worker:
        condition: service_started
